[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qsolutions-video-recorder"
version = "1.0.0"
description = "CSV-driven browser automation and video recorder"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "playwright>=1.40.0",
]

[project.scripts]
capture-video = "capture_video:main"
