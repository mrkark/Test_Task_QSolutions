ServerName localhost

PassEnv DB_HOST
PassEnv DB_PORT
PassEnv DB_NAME
PassEnv DB_USER
PassEnv DB_PASSWORD
PassEnv UPLOAD_FOLDER

<VirtualHost *:80>
    ServerName localhost

    WSGIDaemonProcess web_service python-path=/app user=www-data group=www-data processes=2 threads=5
    WSGIProcessGroup web_service
    WSGIApplicationGroup %{GLOBAL}
    WSGIScriptAlias / /app/app.wsgi

    <Directory /app>
        Require all granted
    </Directory>

    Alias /media /app/uploads
    <Directory /app/uploads>
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
